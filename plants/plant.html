<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">    
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <link rel="stylesheet" href="../style.css">
  <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
  <script src="../js-components/mobile-nav.js" defer></script>
  <script src="../js-components/leaf-background.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Informatie over een plant in de Hortus.">
  <title>Plant | PlantQuiz</title>
  <link rel="icon" type="image/svg+xml" href="../media/favicon/favicon-dark.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="../media/favicon/favicon-light.svg" media="(prefers-color-scheme: dark)">


  <style>
    .plant-detail {
      width: min(900px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }


    .plant-detail-card {
      overflow: hidden;
      border-radius: 0.8rem;
      background: white;
    }

    .plant-detail-card:not([hidden]) {
      animation: plant-detail-enter 520ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    @keyframes plant-detail-enter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .plant-detail-card:not([hidden]) {
        animation: none;
      }
    }

    .plant-detail-image {
      display: block;
      width: 100%;
      max-height: 480px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #f1f6eb;
    }

    .plant-detail-content {
      padding: clamp(1rem, 4vw, 2rem);
    }

    .plant-detail h1 {
      margin-top: 0;
    }

    .plant-detail p {
      line-height: 1.7;
    }

    .plant-detail-status {
      margin: 1rem 0;
    }

    .plant-back-button-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .plant-back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .plant-back-button .material-symbols-outlined {
      display: inline-flex;
      align-items: center;
      margin: 0;
      line-height: 1;
    }
  </style>
</head>

<body data-leaf-icon="local_florist">
  <div class="navbar">
    <img src="../media/Hortus-Logo.webp" alt="Hortus Botanicus Haren" class="navbar-logo" onclick="window.open('https://www.hortusharen.nl/', '_blank');">
    <button class="mobile-nav-toggle" type="button" aria-label="Menu openen" aria-expanded="false" aria-controls="main-navigation">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <div class="nav-links" id="main-navigation">
      <mdui-tooltip content="Home" placement="bottom">
        <a class="navbar-icon-control" href="../" aria-label="Home"><span class="material-symbols-outlined" aria-hidden="true">home</span></a>
      </mdui-tooltip>
      <mdui-tooltip content="Quizzen" placement="bottom">
        <a class="navbar-icon-control" href="../quiz/" aria-label="Quizzen"><span class="material-symbols-outlined" aria-hidden="true">quiz</span></a>
      </mdui-tooltip>
      <mdui-tooltip content="Insecten" placement="bottom">
        <a class="navbar-icon-control" href="../insects/" aria-label="Insecten"><span class="material-symbols-outlined" aria-hidden="true">bug_report</span></a>
      </mdui-tooltip>
      <mdui-tooltip content="Planten" placement="bottom">
        <a class="navbar-icon-control" href="./" aria-label="Planten"><span class="material-symbols-outlined" aria-hidden="true">local_florist</span></a>
      </mdui-tooltip>
      <mdui-tooltip content="Resultaten" placement="bottom">
        <a class="navbar-icon-control" href="../results/" aria-label="Resultaten"><span class="material-symbols-outlined" aria-hidden="true">analytics</span></a>
      </mdui-tooltip>
      <a class="navbar-icon-control location-control" href="https://maps.app.goo.gl/r4i2Kd2u3TkZyYee6" target="_blank" rel="noopener" aria-label="Open locatie in Google Maps">
        <span class="material-symbols-outlined location-icon" aria-hidden="true">location_on</span>
        <span class="location-text">Hortus Botanicus Haren, Kerklaan 34, 9751 NN Haren</span>
      </a>
    </div>
  </div>
  <main class="plant-detail">
    <div class="plant-back-button-container">
      <mdui-button class="mdui-button-filled plant-back-button" href="./"><span class="material-symbols-outlined" aria-hidden="true">keyboard_return</span>Terug naar planten</mdui-button>
    </div>
    <p class="plant-detail-status" id="status" role="status" aria-live="polite">
      Plant laden…
    </p>

    <article class="plant-detail-card" id="plant-detail" hidden>
      <img class="plant-detail-image" id="plant-picture" alt="">
      <div class="plant-detail-content">
        <h1 id="plant-name"></h1>

        <h2>Over deze plant</h2>
        <p id="plant-description"></p>

        <h2>Goed voor bestuiving?</h2>
        <p id="plant-pollination"></p>

        <h2>Bloeiperiode</h2>
        <p id="plant-period"></p>
      </div>
    </article>
  </main>

  <script>
    mdui.setColorScheme("#556b2f");

    const status = document.querySelector("#status");
    const detail = document.querySelector("#plant-detail");
    const plantName = new URLSearchParams(window.location.search).get("plant");

    async function loadPlant() {
      if (!plantName) {
        status.textContent = "Er is geen plant opgegeven.";
        return;
      }

      try {
        const response = await fetch("./data.json");
        if (!response.ok) {
          throw new Error(`Laden mislukt: ${response.status}`);
        }

        const plants = await response.json();
        const plant = plants.find((item) => item.name === plantName);

        if (!plant) {
          status.textContent = "Deze plant is niet gevonden.";
          return;
        }

        document.title = `${plant.name} | PlantQuiz`;
        document.querySelector("#plant-name").textContent = plant.name;
        document.querySelector("#plant-description").textContent = plant.description;
        document.querySelector("#plant-pollination").textContent = plant.bestuiving;
        document.querySelector("#plant-period").textContent = plant.periode;

        const picture = document.querySelector("#plant-picture");
        picture.src = plant.picture;
        picture.alt = plant.name;

        detail.hidden = false;
        status.hidden = true;
      } catch (error) {
        console.error(error);
        status.textContent = "De plantgegevens konden niet worden geladen.";
      }
    }

    loadPlant();
  </script>
</body>
</html>
