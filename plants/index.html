<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bekijk de planten en hun bloeiperiodes in de Hortus.">
    <title>Planten | PlantQuiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
    <link rel="stylesheet" href="../style.css">
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <script src="../js-components/mobile-nav.js" defer></script>
    <script src="../js-components/leaf-background.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="../media/favicon/favicon-dark.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="../media/favicon/favicon-light.svg" media="(prefers-color-scheme: dark)">
    <style>
        :root {
            color-scheme: light;
            --green: #355b37;
            --light-green: #f1f6eb;
            --border: #dce5d5;
            --text: #202820;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--light-green);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }

        main {
            width: min(1100px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 3rem 0;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            color: var(--green);
        }

        .intro {
            margin: 0 auto;
            max-width: 65ch;
            line-height: 1.6;
        }

        .search {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 1.5rem auto;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            background: white;
            color: var(--text);
            font: inherit;
        }

        .plant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 1.25rem;
        }

        .plant-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            background: white;
            color: inherit;
            text-decoration: none;
            transition: transform 150ms ease, box-shadow 150ms ease;
        }

        .plant-card.is-entering {
            animation: plant-card-enter 360ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
            animation-delay: calc(var(--card-index) * 45ms);
        }

        @keyframes plant-card-enter {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .plant-card.is-entering {
                animation: none;
            }
        }

        .plant-card:hover,
        .plant-card:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px #2038201a;
        }

        .plant-card:focus-visible {
            outline: 3px solid var(--green);
            outline-offset: 3px;
        }

        .plant-card img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: var(--light-green);
        }

        .plant-card-content {
            padding: 1rem;
        }

        .plant-card h2 {
            margin: 0 0 0.5rem;
            color: var(--green);
            font-size: 1.2rem;
        }

        .plant-card p {
            line-height: 1.5;
        }

        .plant-description {
            display: -webkit-box;
            overflow: hidden;
            margin: 0 0 0.75rem;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            line-clamp: 3;
        }

        .plant-period {
            margin: 0;
            font-size: 0.95rem;
        }

        .status {
            margin: 1rem 0;
        }
    </style>
</head>

<body data-leaf-icon="local_florist">
    <div class="navbar">
        <img src="../media/Hortus-Logo.webp" alt="Hortus Botanicus Haren" class="navbar-logo" onclick="window.open('https://www.hortusharen.nl/', '_blank');">
        <button class="mobile-nav-toggle" type="button" aria-label="Menu openen" aria-expanded="false" aria-controls="main-navigation">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <div class="nav-links" id="main-navigation">
            <mdui-tooltip content="Home" placement="bottom">
                <a class="navbar-icon-control" href="../" aria-label="Home"><span class="material-symbols-outlined" aria-hidden="true">home</span></a>
            </mdui-tooltip>
            <mdui-tooltip content="Quizzen" placement="bottom">
                <a class="navbar-icon-control" href="../quiz/" aria-label="Quizzen"><span class="material-symbols-outlined" aria-hidden="true">quiz</span></a>
            </mdui-tooltip>
            <mdui-tooltip content="Insecten" placement="bottom">
                <a class="navbar-icon-control" href="../insects/" aria-label="Insecten"><span class="material-symbols-outlined" aria-hidden="true">bug_report</span></a>
            </mdui-tooltip>
            <mdui-tooltip content="Planten" placement="bottom">
                <a class="navbar-icon-control" href="./" aria-label="Planten" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">local_florist</span></a>
            </mdui-tooltip>
            <mdui-tooltip content="Resultaten" placement="bottom">
                <a class="navbar-icon-control" href="../results/" aria-label="Resultaten"><span class="material-symbols-outlined" aria-hidden="true">analytics</span></a>
            </mdui-tooltip>
            <a class="navbar-icon-control location-control" href="https://maps.app.goo.gl/r4i2Kd2u3TkZyYee6" target="_blank" rel="noopener" aria-label="Open locatie in Google Maps">
                <span class="material-symbols-outlined location-icon" aria-hidden="true">location_on</span>
                <span class="location-text">Hortus Botanicus Haren, Kerklaan 34, 9751 NN Haren</span>
            </a>
        </div>
    </div>
    <main>
        <header>
            <h1 class="title"><b>Planten</b></h1>
            <p class="intro">
                Bekijk de planten, lees meer over hun betekenis voor bestuiving en ontdek
                wanneer ze bloeien.
            </p>
        </header>

        <label for="plant-search">Zoek een plant</label>
        <input class="search" id="plant-search" type="search" placeholder="Bijvoorbeeld: Zonnehoed" autocomplete="off">

        <p class="status" id="status" role="status" aria-live="polite">
            Planten laden…
        </p>
        <section class="plant-grid" id="plant-grid" aria-label="Planten"></section>
    </main>

    <script>
        const grid = document.querySelector("#plant-grid");
        const searchInput = document.querySelector("#plant-search");
        const status = document.querySelector("#status");
        let plants = [];

        function createPlantCard(plant, index) {
            const card = document.createElement("a");
            card.className = "plant-card is-entering";
            card.style.setProperty("--card-index", index);
            card.href = `./plant.html?plant=${encodeURIComponent(plant.name)}`;

            const image = document.createElement("img");
            image.src = plant.picture;
            image.alt = plant.name;
            image.loading = "lazy";

            const content = document.createElement("div");
            content.className = "plant-card-content";

            const title = document.createElement("h2");
            title.textContent = plant.name;

            const description = document.createElement("p");
            description.className = "plant-description";
            description.textContent = plant.description;

            const period = document.createElement("p");
            period.className = "plant-period";
            const periodLabel = document.createElement("strong");
            periodLabel.textContent = "Bloeiperiode: ";
            period.append(periodLabel, document.createTextNode(plant.periode));

            content.append(title, description, period);
            card.append(image, content);
            return card;
        }

        function renderPlants() {
            const query = searchInput.value.trim().toLocaleLowerCase("nl");
            const filteredPlants = plants.filter((plant) =>
                plant.name.toLocaleLowerCase("nl").includes(query)
            );

            grid.replaceChildren(...filteredPlants.map(createPlantCard));
            status.textContent = filteredPlants.length
                ? `${filteredPlants.length} planten gevonden.`
                : "Geen planten gevonden.";
        }

        searchInput.addEventListener("input", renderPlants);

        fetch("./data.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Laden mislukt: ${response.status}`);
                }
                return response.json();
            })
            .then((data) => {
                plants = data;
                renderPlants();
            })
            .catch((error) => {
                console.error(error);
                status.textContent = "De planten konden niet worden geladen.";
            });
    </script>
</body>

</html>
