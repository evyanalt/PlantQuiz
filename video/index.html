<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Linking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0..200&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
    <link rel="stylesheet" href="../style.css">
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <script src="../js-components/mobile-nav.js" defer></script>
</head>

<body>
    <div class="navbar">
        <img src="../media/Hortus-Logo.webp" alt="Logo" class="navbar-logo"
            onclick="window.open('https://www.hortusharen.nl/', '_blank');">
        <button class="mobile-nav-toggle" type="button" aria-label="Menu openen" aria-expanded="false" aria-controls="main-navigation">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <div class="nav-links" id="main-navigation">
            <mdui-tooltip content="Home" placement="bottom">
                <a class="navbar-icon-control" href="../" aria-label="Home"><span class="material-symbols-outlined"
                        aria-hidden="true">home</span></a>
            </mdui-tooltip>
            <mdui-tooltip content="Quizzen" placement="bottom">
                <a class="navbar-icon-control" href="../quiz" aria-label="Quizzen"><span
                        class="material-symbols-outlined" aria-hidden="true">quiz</span></a>
            </mdui-tooltip>
            <a class="navbar-icon-control location-control" href="https://maps.app.goo.gl/r4i2Kd2u3TkZyYee6"
                target="_blank" rel="noopener" aria-label="Open locatie in Google Maps">
                <span class="material-symbols-outlined location-icon" aria-hidden="true">location_on</span>
                <span class="location-text">Hortus Botanicus Haren, Kerklaan 34, 9751 NN Haren</span>
            </a>
        </div>
    </div>
    <div class="top">
        <h1 class="title"><b>Video</b></h1>
        <p class="title-description">Bekijk de leuke video die wij hebben gemaakt.</p>
        <div class="m3-player-container">
            <video class="m3-video" src="../media/video.mp4"></video>
            <button class="m3-center-play-btn" aria-label="Play">
                <span class="material-symbols-outlined">play_arrow</span>
            </button>
            <div class="m3-controls-bar">
                <button class="m3-icon-btn" id="play-pause-btn" aria-label="Play/Pause">
                    <span class="material-symbols-outlined" id="play-icon">play_arrow</span>
                </button>
                <div class="m3-time-display">
                    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
                </div>
                <div class="m3-slider-container">
                    <input type="range" class="m3-seek-slider" id="seek-slider" value="0" min="0" max="100" step="0.1">
                </div>
                <button class="m3-icon-btn" id="fullscreen-btn" aria-label="Fullscreen">
                    <span class="material-symbols-outlined">fullscreen</span>
                </button>
            </div>
        </div>
    </div>
    <footer class="footer">Niet officieel verbonden met de Hortus Botanicus Haren.<br>Gecode door Evyan, Gemaakt met Tom, Sofie, Sofia. Links: <a href="https://github.com/evyanalt/PlantQuiz">Code</a></footer>
    <script src="../script.js"></script>
    <script src="../js-components/videoplayer.js"></script>
</body>

</html>
