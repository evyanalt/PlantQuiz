<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Linking -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    </head>
    <body>
        <div class="navbar">
            <img src="media/Hortus-Logo.webp" alt="Logo" class="navbar-logo" onclick="window.open('https://www.hortusharen.nl/', '_blank');">
            <div class="nav-links">
                <!-- Add later -->
            </div>
        </div>
        <mdui-tooltip content="Klik voor google maps" placement="bottom" position="top" style="cursor: pointer;" onclick="window.open('https://maps.app.goo.gl/r4i2Kd2u3TkZyYee6', '_blank');">
            <div class="header hover-container">
                <p><b>Hortus Botanicus Haren Kerklaan 34 9751 NN Haren</b></p>
            </div>
        </mdui-tooltip>
        <div class="top">

            <h1 class="title"><b>Planten Quiz</b></h1>
            <p class="title-description">Test je kennis over planten in de Hortus Botanicus!</p>
        </div>
        <div class="start-button-container">
            <p>Ben jij in de hortus en wil je wel een leuke quiz over de planten? Wij hebben er eentje gemaakt, dus veel plezier!</p>
            <mdui-button class="mdui-button-filled">Start Quiz</mdui-button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
